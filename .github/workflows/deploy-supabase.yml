name: Deploy Supabase
on:
  workflow_dispatch:
concurrency:
  group: deploy-supabase
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ryqcyjajdioaxtpbxjzf
    steps:
      - uses: actions/checkout@v5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.5.6
      - run: deno check supabase/functions/nelio-api/index.ts supabase/functions/nelio-office/index.ts && deno test supabase/tests/core_test.ts
      - name: Require deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN repository secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD repository secret'; exit 1; }
      - uses: supabase/setup-cli@v1
        with:
          version: 2.83.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase db push --linked
      - run: supabase functions deploy nelio-api --project-ref "$SUPABASE_PROJECT_ID"
      - run: supabase functions deploy nelio-office --project-ref "$SUPABASE_PROJECT_ID"
