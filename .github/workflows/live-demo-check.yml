# Rehearses the video on the live database and rolls everything back (supabase/tests/live_demo_check.sql).
# It runs the SQL through the Supabase Management API with the same access token as "Deploy Supabase".
name: Live demo check (rolled back)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ryqcyjajdioaxtpbxjzf
    steps:
      - uses: actions/checkout@v5
      - name: Run the rehearsal (it always ends in a rollback)
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN'; exit 1; }
          body=$(jq -Rs '{query: .}' supabase/tests/live_demo_check.sql)
          curl -sS -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H 'Content-Type: application/json' -d "$body" > out.json || true
          python3 - <<'PY'
          import json
          raw = open('out.json', encoding='utf-8').read()
          try:
              text = json.dumps(json.loads(raw), ensure_ascii=False)
              msg = json.loads(raw).get('message', '') if raw.strip().startswith('{') else raw
          except Exception:
              msg = raw
          i = msg.find('NELIO_CHECK ')
          if i < 0:
              print(raw[:4000]); raise SystemExit(1)
          result, _ = json.JSONDecoder().raw_decode(msg[i + len('NELIO_CHECK '):])
          print(json.dumps(result, ensure_ascii=False, indent=1))
          PY
