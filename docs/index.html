<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#F6F1E7">
  <title>העלאת מסמכים · שדמי ושות', רואי חשבון</title>
  <link rel="icon" href="brand/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="brand/favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&amp;family=Frank+Ruhl+Libre:wght@700&amp;display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <img class="logo" src="brand/logo.svg" width="110" height="52" alt="שדמי ושות', רואי חשבון" id="office-logo">
  </header>

  <main>
    <noscript>
      <section class="sheet message">
        <h1>צריך להפעיל JavaScript</h1>
        <p>כדי להעלות מסמכים, הפעילו JavaScript בדפדפן ופתחו את הקישור שוב.</p>
      </section>
    </noscript>

    <section class="sheet message" id="view-message" hidden>
      <h1 id="message-title"></h1>
      <p id="message-text"></p>
      <p class="muted small" id="message-hint" hidden></p>
      <button type="button" class="button" id="retry-button" hidden>נסו שוב</button>
    </section>

    <!-- The structure of the page is on screen at once, with grey bars where the words will be (D29). -->
    <section id="view-page" aria-busy="true">
      <div class="intro">
        <img class="stamp" id="stamp" src="brand/mark-circle.svg" width="76" height="76" alt="" hidden>
        <div class="intro-text">
          <h1 id="title" class="skeleton-text">&nbsp;</h1>
          <p class="subtitle skeleton-text" id="subtitle">&nbsp;</p>
        </div>
      </div>

      <div class="progress" id="progress" role="status" hidden>
        <div class="progress-text" id="progress-text"></div>
        <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      </div>

      <div class="folder">
        <div class="folder-tab" id="folder-tab">&nbsp;</div>
        <div class="folder-body">
          <div class="sheet">
            <ul class="docs" id="docs">
              <li class="doc skeleton"><span class="box"></span><span class="bar"></span></li>
              <li class="doc skeleton"><span class="box"></span><span class="bar"></span></li>
              <li class="doc skeleton"><span class="box"></span><span class="bar"></span></li>
              <li class="doc skeleton"><span class="box"></span><span class="bar"></span></li>
            </ul>

            <div class="office-note" id="office-note" hidden>
              <button type="button" class="linkish" id="note-open" aria-expanded="false">יש משהו להגיד למשרד?</button>
              <form id="note-form" hidden>
                <label for="note-text">הערה למשרד</label>
                <textarea id="note-text" rows="3" maxlength="500" placeholder="למשל: את דף הבנק אשלח מחר"></textarea>
                <div class="form-actions">
                  <button type="submit" class="button small" id="note-send">שליחה</button>
                  <button type="button" class="linkish" id="note-cancel">ביטול</button>
                </div>
              </form>
              <p class="note-status" id="note-status" role="status" hidden></p>
            </div>
          </div>
        </div>
      </div>
    </section>

    <input class="visually-hidden" id="camera-input" type="file" accept="image/*" capture="environment" tabindex="-1">
    <input class="visually-hidden" id="files-input" type="file" accept="image/*,application/pdf" multiple tabindex="-1">
  </main>

  <footer class="foot">
    <div>פרויקט הדגמה, משרד בדיוני</div>
    <div class="versions" id="versions"></div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
